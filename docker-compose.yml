services:
  db:
    image: postgres:16-alpine
    container_name: foodverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodverse_user
      POSTGRES_PASSWORD: foodverse_password
      POSTGRES_DB: foodverse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodverse_user -d foodverse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodverse-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://foodverse_user:foodverse_password@db:5432/foodverse_db
      JWT_SECRET: foodverse-production-super-secure-key-32chars
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENABLE_OFFLINE_DEMO_FALLBACK: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodverse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  backend-uploads:
